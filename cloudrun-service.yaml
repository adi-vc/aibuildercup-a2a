# cloudrun-service.yaml — declarative Cloud Run service spec for the Vachan API.
#
# Deploy manually:
#   gcloud run services replace cloudrun-service.yaml --region=asia-south1
#
# Replace placeholders before using:
#   YOUR_PROJECT_ID   — your GCP project id
#   YOUR_REGION       — e.g. asia-south1
#   YOUR_IMAGE        — full Artifact Registry image URI

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vachan-api
  labels:
    app: vachan
    component: api
  annotations:
    run.googleapis.com/launch-stage: GA

spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle (cost-efficient for a hackathon)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: asia-south1-docker.pkg.dev/a2a-ghostrider-511215/vachan/api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENV
              value: production
            - name: GOOGLE_CLOUD_PROJECT
              value: a2a-ghostrider-511215
            - name: GCS_BUCKET
              value: vachan_bucket
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: GEMINI_API_KEY
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 30

  traffic:
    - percent: 100
      latestRevision: true
