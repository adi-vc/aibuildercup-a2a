<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Placeholder depth map for placeholder_flood_street.svg (white = near,
       black = far). Stands in for P4's monocular depth pass (§32.1 #8) so the
       runtime's parallax shader runs before real plates exist. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect x="0" y="120" width="180" height="600" fill="#8c8c8c"/>
  <rect x="1100" y="100" width="180" height="620" fill="#8c8c8c"/>
  <rect x="0" y="500" width="1280" height="220" fill="url(#ground)"/>
</svg>
