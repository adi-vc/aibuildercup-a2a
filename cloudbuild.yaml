# cloudbuild.yaml — Google Cloud Build pipeline for Vachan.
#
# Triggered on push to main branch (configure in Cloud Build → Triggers).
# Builds and deploys:
#   1. Backend image → Artifact Registry → Cloud Run
#   2. Frontend static build → Firebase Hosting
#
# Required substitutions (set in the trigger or project config):
#   _REGION          e.g. asia-south1
#   _PROJECT_ID      your GCP project id
#   _API_SERVICE     name of the Cloud Run service, e.g. vachan-api
#   _FIREBASE_TOKEN  (optional) use Workload Identity instead when possible
#
# Prerequisites:
#   gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com
#   gcloud artifacts repositories create vachan --repository-format=docker --location=$_REGION

substitutions:
  _REGION: asia-south1
  _PROJECT_ID: a2a-ghostrider-511215
  _API_SERVICE: vachan-api
  _IMAGE: asia-south1-docker.pkg.dev/a2a-ghostrider-511215/vachan/api

steps:

  # ── 1. Run backend tests ──────────────────────────────────────────────────
  - name: python:3.11-slim
    id: backend-test
    entrypoint: bash
    args:
      - -c
      - |
        cd backend
        pip install -r requirements-dev.txt -q
        python -m pytest tests/ -v
        python -m manifest_schema.linter fixtures/p0_single_beat.json --strict

  # ── 2. Build the backend Docker image ─────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: backend-build
    args:
      - build
      - -t
      - ${_IMAGE}:${BUILD_ID}
      - -t
      - ${_IMAGE}:latest
      - ./backend
    waitFor:
      - backend-test

  # ── 3. Push the image to Artifact Registry ────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: backend-push
    args:
      - push
      - --all-tags
      - ${_IMAGE}
    waitFor:
      - backend-build

  # ── 4. Deploy to Cloud Run ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: backend-deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=10
      - --memory=512Mi
      - --cpu=1
      - --port=8080
      - --set-env-vars=ENV=production,GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}
    waitFor:
      - backend-push

  # ── 5a. Prepare the frontend ─────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: frontend-prep
    entrypoint: bash
    args:
      - -c
      - |
        cd frontend

        # Get the deployed Cloud Run URL
        API_URL=$$(gcloud run services describe ${_API_SERVICE} \
          --project=${_PROJECT_ID} \
          --region=${_REGION} \
          --platform=managed \
          --format='value(status.url)')
        
        if [ -z "$$API_URL" ]; then
          echo "ERROR: Failed to get Cloud Run URL"
          exit 1
        fi
        
        echo "Building frontend with API URL: $$API_URL"
        
        # Create a production env file that Vite will use during build
        echo "VITE_API_BASE_URL=$$API_URL" > .env.production
        
        # Verify the URL was baked in (check the built JS bundle)
        if grep -q "$$API_URL" dist/assets/*.js; then
          echo "✓ API URL successfully baked into bundle"
        else
          echo "⚠ Warning: API URL not found in bundle"
        fi
    waitFor:
      - backend-deploy
  
  # ── 5b. Build the frontend ─────────────────────────────────────────────────
  - name: node:20-slim
    id: frontend-build
    entrypoint: bash
    args:
      - -c
      - |
        cd frontend
        npm ci --silent
        npm run build
    waitFor:
      - frontend-prep

  # ── 6. Deploy frontend to Firebase Hosting ────────────────────────────────
  - name: node:20-slim
    id: frontend-deploy
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools --silent
        cd frontend
        firebase deploy --only hosting --non-interactive --project=${_PROJECT_ID}
    waitFor:
      - frontend-build

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

timeout: 1200s
